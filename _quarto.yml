appendices:
  - appendices/a-setup.qmd 
search: true 
downloads: [pdf, epup]
repo-url: https://github.com/amakundisamuelbako/Python_Zero_to_Backend_Course.git
bibliography: references.bib
number-depth: 2 

execute: 
  freeze: auto  # only re-run code in chapters i changed 
  warning: false 

format:
  html:
    theme:
      - cosmo
      - brand
    code-copy: true 
    code-overflow: wrap 
  pdf:
    documentclass: scrreprt
    toc: true 
    toc-depth: 2 
    fontsize: 10pt
    mainfont: "Libertinus Serif"
    sansfont: "Libertinus Sans"
    monofont: "JetBrains Mono"
    geometry: 
      - paperwidth=6in 
      - paperheight=9in 
      - inner=0.875in
      - outer=0.625in
      - top=0.75in
      - bottom=0.75in
    code-block-bg: true 
    code-block-border-left: "#1F4E79"
    include-in-header: tex/preamble.tex
    keep-tex: true
  epub:
    css: styles/epub.css 
    cover-image: images/cover.png 





